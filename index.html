<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Royale Pizza</title>
<meta name="description" content="Grand Royale Pizza. Wood-fired pizza. Loud room. Coming soon.">
<style>
  :root { --bg:#111; --fg:#f3efe6; --accent:#ffd400; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
  h1{font-size:clamp(2.5rem,12vw,8rem);line-height:.9;margin:0;letter-spacing:-.04em;text-transform:uppercase;font-weight:900}
  h1 span{display:block;color:var(--accent)}
  p{font-size:clamp(1rem,2.5vw,1.5rem);margin:1.5rem 0 0;text-transform:uppercase;letter-spacing:.2em}
</style>
</head>
<body>
<main>
  <h1>Grand<span>Royale</span>Pizza</h1>
  <p>Wood-fired. Loud. Coming soon.</p>
</main>
</body>
</html>
